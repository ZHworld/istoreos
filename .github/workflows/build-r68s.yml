name: 🔧 Build R68S Custom Firmware

on:
  push:
    branches: [istoreos-24.10]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'fastrhino_r6xs'
        type: choice
        options:
          - fastrhino_r6xs

env:
  DEVICE: fastrhino_r6xs
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository != 'istoreos/istoreos'

    steps:
      - name: Checkout iStoreOS source
        uses: actions/checkout@v4
        with:
          ref: istoreos-24.10
          fetch-depth: 1

      - name: Verify patches
        run: |
          echo "=== Patches check ==="
          ls -la target/linux/rockchip/patches-6.6/13*.patch
          # Check for naming conflicts
          conflicts=$(ls target/linux/rockchip/patches-6.6/*.patch | sed 's/.*\///' | sed 's/-.*//' | sort | uniq -d)
          if [ -n "$conflicts" ]; then
            echo "❌ CONFLICT: Duplicate patch numbers:"
            echo "$conflicts"
            exit 1
          fi
          echo "✅ No conflicts"

      - name: Verify DTS change
        run: |
          echo "=== R68S DTS ==="
          cat target/linux/rockchip/dts/rk3568/rk3568-fastrhino-r68s.dts
          if grep -q "snps,reset-gpio" target/linux/rockchip/dts/rk3568/rk3568-fastrhino-r68s.dts; then
            echo "❌ Deprecated snps,reset still present!"
            exit 1
          fi
          echo "✅ DTS check passed"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget \
            libelf-dev patchelf xxd

      - name: Restore downloads cache
        uses: actions/cache@v4
        id: cache-dl
        with:
          path: dl
          key: dl-${{ hashFiles('**/CHECKSUM*', '**/*.hash', '**/Makefile') }}

      - name: Restore build cache (toolchain)
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            staging_dir
            build_dir
            tmp
          key: build-rockchip-${{ hashFiles('target/linux/rockchip/Makefile', 'toolchain/**') }}

      - name: Configure for R68S
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_fastrhino_r6xs=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_IB=y
          CONFIG_JSON_OVERVIEW_IMAGE_INFO=y
          EOF
          make defconfig 2>&1

      - name: Check prerequisites
        run: make prereq 2>&1

      - name: Build toolchain
        run: make tools/toolchain -j$(nproc) 2>&1

      - name: Build kernel and packages
        run: |
          set -o pipefail
          make target/linux/compile package/compile -j$(nproc) V=sc 2>&1 | tail -100

      - name: Build firmware image
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tail -100

      - name: Check firmware output
        run: |
          echo "=== Build output ==="
          find bin/targets/ -name "*.img*" -o -name "*manifest*" -o -name "*r6xs*" -o -name "*r68s*" 2>/dev/null | while read f; do
            ls -lh "$f"
          done
          echo "---"
          echo "All targets:"
          ls -lh bin/targets/rockchip/armv8/ 2>/dev/null || echo "No firmware found"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-r68s-firmware
          path: |
            bin/targets/rockchip/armv8/*.img.gz
            bin/targets/rockchip/armv8/*.img
            bin/targets/rockchip/armv8/*.manifest
            bin/targets/rockchip/armv8/*.buildinfo
            bin/targets/rockchip/armv8/sha256sums
          retention-days: 30
          if-no-files-found: error
