name: 🔧 Build R68S Custom Firmware

on:
  push:
    branches: [istoreos-24.10]
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository != 'istoreos/istoreos'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: istoreos-24.10
          fetch-depth: 1

      - name: Verify DTS change
        run: |
          echo "=== R68S DTS ==="
          cat target/linux/rockchip/dts/rk3568/rk3568-fastrhino-r68s.dts
          # Verify deprecated snps,reset is gone (exclude /delete-property/ lines)
          if grep "snps,reset" target/linux/rockchip/dts/rk3568/rk3568-fastrhino-r68s.dts | grep -qv "delete-property"; then
            echo "❌ Deprecated snps,reset still present!"
            exit 1
          fi
          # Verify mdio fix is present
          if grep -q "reset-assert-us" target/linux/rockchip/dts/rk3568/rk3568-fastrhino-r68s.dts; then
            echo "✅ PHY reset fix in place"
          else
            echo "❌ Missing PHY reset fix!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget \
            libelf-dev patchelf xxd

      - uses: actions/cache@v4
        id: cache-dl
        with:
          path: dl
          key: dl-${{ hashFiles('**/CHECKSUM*', '**/*.hash', '**/Makefile') }}

      - uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            staging_dir
            build_dir
            tmp
          key: build-rockchip-v2-${{ hashFiles('target/linux/rockchip/Makefile', 'toolchain/**') }}

      - name: Configure
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_fastrhino_r6xs=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          EOF
          make defconfig 2>&1

      - name: Build firmware
        run: |
          echo "=== Building (may take 2-4 hours) ==="
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Exit code: $EXIT_CODE ==="
          tail -30 /tmp/build.log
          if grep -q "failed to build\|ERROR:" /tmp/build.log 2>/dev/null; then
            echo "=== ERROR CONTEXT ==="
            grep -B5 "failed to build\|ERROR:" /tmp/build.log | tail -30
          fi
          exit $EXIT_CODE

      - name: List firmware
        run: |
          find bin/ -name "*.img*" -o -name "*r6xs*" -o -name "*r68s*" 2>/dev/null | head -10
          ls -lh bin/targets/rockchip/armv8/ 2>/dev/null || echo "No firmware"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-r68s-firmware
          path: bin/targets/rockchip/armv8/*.img.gz
          if-no-files-found: error
